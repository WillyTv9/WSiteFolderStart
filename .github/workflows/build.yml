name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compila l'app
        run: |
          cd macos
          chmod +x build.sh
          ./build.sh
          ditto -c -k --keepParent WSiteFolderStart.app ../WSiteFolderStart-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WSiteFolderStart-macOS
          path: WSiteFolderStart-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compila l'app
        run: dotnet publish windows/WSiteFolderStart.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: WSiteFolderStart-Windows
          path: out/WSiteFolderStart.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WSiteFolderStart-macOS.zip
            dist/WSiteFolderStart.exe
